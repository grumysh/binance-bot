[project]
name = "binance-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ccxt>=4.5.90",
    "nicegui>=3.18.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = "app.py"
